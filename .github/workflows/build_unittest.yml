env:
  CTEST_TIMEOUT: 120

name: build_unittest

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    strategy:
      matrix:
        os: [windows-latest]
        config: [Release, Debug]
    name: ${{ matrix.os }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: configure
      run: |
        ls env:
        cmake -B target-${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}
    - name: build
      run: |
        cmake --build target-${{ matrix.config }} -j
    - name: test # should run w/o install
      run: |
        ctest --test-dir target-${{ matrix.config }} --output-on-failure --timeout $env:CTEST_TIMEOUT

# Since MSBUILD solutions can be generated from CMake within VS, no point testing in build.

  build-ubuntu:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        configuration: [Debug, Release]
        avx: [AVX512F]
    name: ${{ matrix.os }}-${{ matrix.configuration }}-${{ matrix.avx }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: configure
      run: |
        cmake -B out -DENABLE_${{ matrix.avx }}=ON
    - name: build
      run: |
        cmake --build out -j
    - name: test
    # should run w/o install
      run: |
        ctest --test-dir out --output-on-failure --timeout $CTEST_TIMEOUT

  build-rocky:
    strategy:
      matrix:
        version: [8, 9, 10]
    name: rockylinux-${{ matrix.version }}-Release
    runs-on: ubuntu-24.04
    container:
      image: rockylinux/rockylinux:${{ matrix.version }}-minimal
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - name: setup system
      run: |
        microdnf install gcc gcc-c++ tar gzip cmake
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: configure
      run: |
        cmake -B target -DCMAKE_BUILD_TYPE=Release
    - name: build
      run: |
        cmake --build target -j
    - name: test
    # should run w/o install
      run: |
        ctest --test-dir target --output-on-failure
